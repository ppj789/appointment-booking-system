spring:
  application:
    name: appointment-booking-api
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${BOOKING_DB_URL}
    username: ${BOOKING_DB_USERNAME}
    password: ${BOOKING_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true

server:
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never
  max-http-request-header-size: 16KB
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${BOOKING_SESSION_COOKIE_SECURE:true}

booking:
  identity-security:
    credential-setup-expiry: ${BOOKING_CREDENTIAL_SETUP_EXPIRY:24h}
    absolute-session-timeout: ${BOOKING_ABSOLUTE_SESSION_TIMEOUT:8h}
    login-rate-limit:
      attempts: ${BOOKING_LOGIN_RATE_LIMIT_ATTEMPTS:10}
      window: ${BOOKING_LOGIN_RATE_LIMIT_WINDOW:5m}
    setup-rate-limit:
      attempts: ${BOOKING_SETUP_RATE_LIMIT_ATTEMPTS:10}
      window: ${BOOKING_SETUP_RATE_LIMIT_WINDOW:5m}
    provisioning-rate-limit:
      attempts: ${BOOKING_PROVISIONING_RATE_LIMIT_ATTEMPTS:20}
      window: ${BOOKING_PROVISIONING_RATE_LIMIT_WINDOW:5m}
    guest-invitation-rate-limit:
      attempts: ${BOOKING_GUEST_INVITATION_RATE_LIMIT_ATTEMPTS:30}
      window: ${BOOKING_GUEST_INVITATION_RATE_LIMIT_WINDOW:5m}
    guest-availability-rate-limit:
      attempts: ${BOOKING_GUEST_AVAILABILITY_RATE_LIMIT_ATTEMPTS:120}
      window: ${BOOKING_GUEST_AVAILABILITY_RATE_LIMIT_WINDOW:1m}
    guest-confirmation-rate-limit:
      attempts: ${BOOKING_GUEST_CONFIRMATION_RATE_LIMIT_ATTEMPTS:10}
      window: ${BOOKING_GUEST_CONFIRMATION_RATE_LIMIT_WINDOW:1m}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: logstash

springdoc:
  packages-to-scan: com.github.ppj789.booking
  paths-to-match: /api/**
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    doc-expansion: none
