spring:
  application:
    name: appointment-booking-api
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:5432/appointment_booking}
    username: ${BOOKING_DB_USERNAME:booking_app}
    password: ${BOOKING_DB_PASSWORD:local_booking_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${BOOKING_SESSION_COOKIE_SECURE:true}

booking:
  identity-security:
    credential-setup-expiry: ${BOOKING_CREDENTIAL_SETUP_EXPIRY:24h}
    absolute-session-timeout: ${BOOKING_ABSOLUTE_SESSION_TIMEOUT:8h}
    login-rate-limit:
      attempts: ${BOOKING_LOGIN_RATE_LIMIT_ATTEMPTS:10}
      window: ${BOOKING_LOGIN_RATE_LIMIT_WINDOW:5m}
    setup-rate-limit:
      attempts: ${BOOKING_SETUP_RATE_LIMIT_ATTEMPTS:10}
      window: ${BOOKING_SETUP_RATE_LIMIT_WINDOW:5m}
    provisioning-rate-limit:
      attempts: ${BOOKING_PROVISIONING_RATE_LIMIT_ATTEMPTS:20}
      window: ${BOOKING_PROVISIONING_RATE_LIMIT_WINDOW:5m}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: Appointment Booking API
    description: Full-stack assessment foundation

springdoc:
  packages-to-scan: com.github.ppj789.booking
  paths-to-match: /api/**
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    doc-expansion: none
