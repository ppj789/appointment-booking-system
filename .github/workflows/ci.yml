name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Run isolated tests
        run: npm run test:ci
      - name: Build production bundle
        run: npm run build

  repository:
    name: Repository
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: .github/tooling/package-lock.json
      - name: Install repository tooling
        run: npm ci
        working-directory: .github/tooling
      - name: Validate public documentation
        run: npm run docs:check
        working-directory: .github/tooling
      - name: Build backend container
        run: docker build --pull --tag appointment-booking-backend:ci backend
      - name: Build frontend container
        run: docker build --pull --tag appointment-booking-frontend:ci frontend
