name: appointment-booking

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appointment_booking}
      POSTGRES_USER: ${POSTGRES_USER:-booking_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_booking_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - application

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      BOOKING_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-appointment_booking}
      BOOKING_DB_USERNAME: ${POSTGRES_USER:-booking_app}
      BOOKING_DB_PASSWORD: ${POSTGRES_PASSWORD:-local_booking_password}
      BOOKING_SESSION_COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    networks:
      - application

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    networks:
      - application

volumes:
  postgres-data:

networks:
  application:
    driver: bridge
